name: Feature request
description: Suggest a new feature or enhancement for the Mondial Relay integration
title: "[Feature]: "
labels: ["enhancement"]
assignees:
  - peter-mdf
body:
  - type: dropdown
    id: source
    attributes:
      label: Which Mondial Relay setup is this about?
      description: The source you picked during setup, shown on the integration's entry under Settings → Devices & services → Mondial Relay.
      options:
        - Account
        - Tracking code
        - All of them / not setup-specific
    validations:
      required: true

  - type: dropdown
    id: country
    attributes:
      label: Which country is this about?
      description: A country is only picked for an Account setup; tracking codes are country-less.
      options:
        - France
        - Belgium
        - Netherlands
        - Spain
        - Portugal
        - All of them / not country-specific
    validations:
      required: false

  - type: textarea
    id: feature
    attributes:
      label: What would you like to see?
      description: Describe the feature or improvement you have in mind.
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: How would you use this? What problem does it solve?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Is there an existing workaround, or have you tried something else?
